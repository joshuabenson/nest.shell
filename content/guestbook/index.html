<div class="bg-white shadow-md rounded-lg p-6">
    <h1 class="text-3xl font-bold mb-6">📖 Guestbook</h1>
    <p class="text-gray-600 mb-6">Leave a message! Pick an emoji to express your mood.</p>
    
    <!-- Add entry form -->
    <div class="bg-gray-50 rounded-lg p-4 mb-8 border">
        <div class="flex gap-3 mb-3">
            <input id="guest-name" type="text" class="border rounded px-3 py-2 flex-1" placeholder="Your name" maxlength="50">
        </div>
        <div class="flex gap-3 mb-3">
            <textarea id="guest-message" class="border rounded px-3 py-2 flex-1" rows="2" placeholder="Your message..." maxlength="500"></textarea>
        </div>
        <div class="flex gap-3 items-center">
            <select id="guest-emoji" class="border rounded px-3 py-2 text-xl">
                <option>👋</option><option>😊</option><option>🎉</option><option>🚀</option>
                <option>💡</option><option>❤️</option><option>🔥</option><option>👍</option>
                <option>🐚</option><option>🌈</option><option>🦄</option><option>🍕</option>
            </select>
            <button onclick="addGuestbookEntry()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded font-medium transition">
                Sign Guestbook
            </button>
        </div>
    </div>

    <!-- Entries rendered here -->
    <div id="guestbook-container">
        {{content}}
    </div>
</div>
